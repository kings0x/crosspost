name: CI

on:
  pull_request:
    branches:
      - "develop"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      pull-requests: write
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: crosspost
          POSTGRES_PASSWORD: crosspost
          POSTGRES_DB: crosspost
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache Infisical CLI
        id: cache-infisical
        uses: actions/cache@v4
        with:
          path: ~/.local/bin/infisical
          key: infisical-${{ runner.os }}-latest

      - name: Install Infisical CLI
        if: steps.cache-infisical.outputs.cache-hit != 'true'
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get update && sudo apt-get install -y infisical
          mkdir -p ~/.local/bin
          cp /usr/bin/infisical ~/.local/bin/infisical

      - name: Add local bin to PATH
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Pull secrets from Infisical
        env:
          INFISICAL_CLIENT_ID: ${{ secrets.INFISICAL_CLIENT_ID }}
          INFISICAL_CLIENT_SECRET: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          INFISICAL_PROJECT_ID: ${{ secrets.INFISICAL_PROJECT_ID }}
        run: |
          INFISICAL_TOKEN=$(infisical login \
            --method=universal-auth \
            --client-id="${INFISICAL_CLIENT_ID}" \
            --client-secret="${INFISICAL_CLIENT_SECRET}" \
            --silent \
            --plain)

          infisical export \
            --token="${INFISICAL_TOKEN}" \
            --projectId="${INFISICAL_PROJECT_ID}" \
            --env=staging \
            --format=dotenv > /tmp/infisical_secrets.env

          sed "s/'//g" /tmp/infisical_secrets.env >> "$GITHUB_ENV"

      - name: Override database and redis for CI
        run: |
          echo "DATABASE_URL=postgres://crosspost:crosspost@localhost:5432/crosspost" >> "$GITHUB_ENV"
          echo "REDIS_URL=redis://localhost:6379" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa
        with:
          version: v2.12.2
          only-new-issues: true

      - name: Cache migrate CLI
        id: cache-migrate
        uses: actions/cache@v4
        with:
          path: ~/go/bin/migrate
          key: migrate-${{ runner.os }}-v4.19.1-pgx5

      - name: Install migrate CLI
        if: steps.cache-migrate.outputs.cache-hit != 'true'
        run: |
          go install -tags 'pgx5' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Run migrations
        run: |
          MIGRATION_URL=$(echo "${DATABASE_URL}" | tr -d "'" | sed 's/^postgres:\/\//pgx5:\/\//;s/^postgresql:\/\//pgx5:\/\//')
          migrate -path ./migrations -database "${MIGRATION_URL}" up

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Enable auto-merge
        if: success() && github.base_ref == 'develop'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
