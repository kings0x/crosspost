name: CI

on:
  pull_request:
    branches:
      - "develop"

jobs:
  validate:
    runs-on: ubuntu-latest
    environment: staging

    permissions:
      pull-requests: write
      contents: write

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: crosspost_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/crosspost_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install dependencies
        run: go mod download

      - name: Lint
        uses: golangci/golangci-lint-action@v4

      - name: Install migrate CLI
        run: |
          go install -tags 'pgx5' github.com/golang-migrate/migrate/v4/cmd/migrate@v4.19.1

      - name: Run migrations
        run: |
          MIGRATION_URL=$(echo "${DATABASE_URL}" | sed 's/^postgres:\/\//pgx5:\/\//;s/^postgresql:\/\//pgx5:\/\//')
          migrate -path ./migrations -database "${MIGRATION_URL}" up

      - name: Test
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Enable auto-merge
        if: success() && github.base_ref == 'develop'
        run: |
          gh pr merge --auto --squash "${{ github.event.pull_request.number }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
